<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Deploy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { padding-top: 70px; } pre { max-height: 500px; overflow: auto; }</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">Deploy Platform</a>
    <div class="navbar-nav ms-auto">
      {% if current_user.is_authenticated %}
        <span class="navbar-text me-3">{{ current_user.email }}</span>
        <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}
    <div class="alert alert-info">{{ m }}</div>
  {% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
